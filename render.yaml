services:
  - type: web
    name: ml-capstone-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
